name: Build Clean Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          npx vite build

      - name: Setup Capacitor (JSON Config)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          echo '{"appId": "com.dukaan.pro", "appName": "Dukaan Pro", "webDir": "dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: dukaanpro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
